[project]
name = "agentic-scientific-paper-template"
version = "0.1.0"
description = "TODO: Replace with your project description"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "TODO: Your Name", email = "TODO: you@example.com" },
]
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
