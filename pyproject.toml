[project]
name = "diskriminierungsfreie-metadaten"
version = "2.0.0a0"
description = "Check scripts for the handbook Diskriminierungssensible Metadatenpraxis"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Moritz Mähr" },
    { name = "Noëlle Schnegg" },
]
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["outputs", "_manuscript", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
